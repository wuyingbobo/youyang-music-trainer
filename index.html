<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>悠扬音乐训练营｜节奏练习</title><style>body{margin:0;background:#f7f4ed;color:#273b42;font-family:system-ui,-apple-system,sans-serif;text-align:center}main{max-width:650px;margin:auto;padding:18px}h1{font-size:25px}section{background:white;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}.score{font-size:43px;letter-spacing:10px;margin:25px 0 10px}.lines{font-size:35px;letter-spacing:7px;line-height:16px}.meta{text-align:left;font-weight:700}.drum{display:block;margin:20px auto;width:190px;height:190px;border-radius:50%;border:12px solid #6d9ca4;background:radial-gradient(circle at 35% 25%,#d3f1ed,#66b2af);font-size:30px;color:#174c52;touch-action:manipulation;box-shadow:0 9px 0 #386e78;user-select:none}.drum:active{transform:translateY(5px);box-shadow:0 4px 0 #386e78}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;margin:5px;background:#266b78;color:white;font-size:16px}button.secondary{background:#dbe8e7;color:#1b515b}input{width:170px}small{color:#687a7c}</style></head><body><main><h1>♪ 悠扬音乐训练营</h1><p>第一关 · 《向前走》节奏练习</p><section><div class="meta">1 = F　　4/4</div><p style="font-weight:600">节奏谱待核对原谱</p><small>上一版的减时线与小节时值不准确，暂不作为练习依据</small></section><section><label>速度：<b id="speed">80</b> BPM　<input id="bpm" type="range" min="40" max="160" value="80"></label><p><button id="met">▶ 开启节拍器</button><button id="demo" class="secondary">▶ 节奏示范</button></p><button id="drum" class="drum">🥁<br>打鼓</button><p><button id="test" class="secondary">🔊 测试声音</button><button id="stop" class="secondary">停止</button></p><p id="msg" aria-live="polite">请先点击“测试声音”启动音频。</p><small id="diag">音频状态：尚未检测</small></section><button id="next">完成，进入第二关 →</button></main><script>
let ctx=null,timer=null,demoTimers=[],beatIndex=0;
const $=id=>document.getElementById(id);
function status(msg){$('msg').textContent=msg;$('diag').textContent='音频状态：'+(ctx?ctx.state:'尚未创建')+'；浏览器支持：'+(window.AudioContext||window.webkitAudioContext?'是':'否')}
async function unlock(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){status('此浏览器不支持 Web Audio，请换 Safari 或 Chrome');return false}
 try{
  if(!ctx)ctx=new AC();
  if(ctx.state!=='running')await ctx.resume();
  const silent=ctx.createBuffer(1,1,ctx.sampleRate),source=ctx.createBufferSource();source.buffer=silent;source.connect(ctx.destination);source.start();
  status(ctx.state==='running'?'声音引擎已启动，请听鼓声':'声音引擎未启动，请检查浏览器设置');
  return ctx.state==='running';
 }catch(e){status('音频启动失败：'+e.message);return false}
}
function tone(freq=660,volume=.28,duration=.13){
 // Soft two-note wooden-block click: fixed pitch, short decay, no siren-like glide.
 const t=ctx.currentTime,accent=freq>=800;
 const level=accent?.13:.09;
 const base=accent?680:520;
 for(const [ratio,mix] of [[1,1],[1.52,.25]]){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.setValueAtTime(base*ratio,t);
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(level*mix,t+.002);
  g.gain.exponentialRampToValueAtTime(.0001,t+.065);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.07);
 }
}
function drum(){
 const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();
 o.type='sine';o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(58,t+.19);
 g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.8,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+.22);
 o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.24);
 const n=Math.floor(ctx.sampleRate*.12),buf=ctx.createBuffer(1,n,ctx.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(n/10));
 const s=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
 s.buffer=buf;filter.type='lowpass';filter.frequency.value=1100;gain.gain.value=.5;
 s.connect(filter);filter.connect(gain);gain.connect(ctx.destination);s.start(t)
}
function stop(){if(timer){clearInterval(timer);timer=null}$('met').textContent='▶ 开启节拍器';demoTimers.forEach(clearTimeout);demoTimers=[]}
async function startMet(){if(!await unlock())return;let i=0;tone(880);i++;timer=setInterval(()=>tone(i++%4===0?880:570),60000/Number($('bpm').value));$('met').textContent='■ 关闭节拍器'}
$('bpm').oninput=()=>{$('speed').textContent=$('bpm').value;if(timer){stop();startMet()}};
$('met').onclick=()=>timer?stop():startMet();
$('drum').onclick=async()=>{if(await unlock())drum()};
$('test').onclick=async()=>{if(!await unlock())return;drum();setTimeout(()=>{tone(880);status('测试完成：先是低音鼓声，再是柔和的木质节拍声。若仍无声，请检查网页是否静音、系统输出设备和音量')},350)};
$('stop').onclick=stop;
$('demo').onclick=async()=>{stop();if(!await unlock())return;status('播放节奏示范（临时音型，非原谱）');let beat=60000/Number($('bpm').value);[0,.5,1,1.5,2,3].forEach(v=>demoTimers.push(setTimeout(drum,v*beat)));demoTimers.push(setTimeout(()=>status('示范结束'),4*beat))};
$('next').onclick=()=>{stop();status('第二关视唱练习正在开发中')};
status('等待点击测试声音');
</script></body></html>
