<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>悠扬音乐训练营｜节奏练习</title><style>body{margin:0;background:#f7f4ed;color:#273b42;font-family:system-ui,-apple-system,sans-serif;text-align:center}main{max-width:650px;margin:auto;padding:18px}h1{font-size:25px}section{background:white;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}.score{font-size:43px;letter-spacing:10px;margin:25px 0 10px}.lines{font-size:35px;letter-spacing:7px;line-height:16px}.meta{text-align:left;font-weight:700}.drum{display:block;margin:20px auto;width:190px;height:190px;border-radius:50%;border:12px solid #6d9ca4;background:radial-gradient(circle at 35% 25%,#d3f1ed,#66b2af);font-size:30px;color:#174c52;touch-action:manipulation;box-shadow:0 9px 0 #386e78;user-select:none}.drum:active{transform:translateY(5px);box-shadow:0 4px 0 #386e78}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;margin:5px;background:#266b78;color:white;font-size:16px}button.secondary{background:#dbe8e7;color:#1b515b}input{width:170px}small{color:#687a7c}</style></head><body><main><h1>♪ 悠扬音乐训练营</h1><p>第一关 · 《向前走》节奏练习</p><section><div class="meta">1 = F　　4/4</div><div class="score">× × × × × ×</div><div class="lines">━━ ━━</div><small>前四个 × 为八分音符，后两个为四分音符</small></section><section><label>速度：<b id="speed">80</b> BPM　<input id="bpm" type="range" min="40" max="160" value="80"></label><p><button id="met">▶ 开启节拍器</button><button id="demo" class="secondary">▶ 节奏示范</button></p><button id="drum" class="drum">🥁<br>打鼓</button><p><button id="test" class="secondary">🔊 测试声音</button><button id="stop" class="secondary">停止</button></p><small id="msg">点击鼓面即可打节奏。浏览器需首次触摸才能播放声音。</small></section><button id="next">完成，进入第二关 →</button></main><script>let ctx,timer=null,demoTimers=[];const $=id=>document.getElementById(id);function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}function beep(accent=false){const c=audio(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sine';o.frequency.setValueAtTime(accent?880:660,t);o.frequency.exponentialRampToValueAtTime(accent?540:440,t+.07);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.2,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+.09);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.1)}function hit(){const c=audio(),t=c.currentTime,n=c.sampleRate*.16,buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(n/7));let s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=750;g.gain.value=.7;s.connect(f).connect(g).connect(c.destination);s.start(t);const o=c.createOscillator(),v=c.createGain();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(55,t+.12);v.gain.setValueAtTime(.45,t);v.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(v).connect(c.destination);o.start(t);o.stop(t+.17)}function stop(){if(timer){clearInterval(timer);timer=null}$('met').textContent='▶ 开启节拍器';demoTimers.forEach(clearTimeout);demoTimers=[]}$('bpm').oninput=()=>{$('speed').textContent=$('bpm').value;if(timer){stop();startMet()}};function startMet(){audio();let count=0;beep(true);count++;timer=setInterval(()=>beep((count++%4)===0),60000/+$('bpm').value);$('met').textContent='■ 关闭节拍器'}$('met').onclick=()=>timer?stop():startMet();$('drum').onclick=hit;$('test').onclick=()=>{hit();setTimeout(()=>beep(true),250);$('msg').textContent='测试音已播放：先鼓声，后节拍器声'};$('stop').onclick=stop;$('demo').onclick=()=>{stop();audio();const beat=60000/+$('bpm').value;[0,.5,1,1.5,2,3].forEach((v,i)=>demoTimers.push(setTimeout(()=>{hit();$('msg').textContent='示范音符 '+(i+1)+'/6'},v*beat)));demoTimers.push(setTimeout(()=>$('msg').textContent='示范结束，可以自己打鼓练习',4*beat))};$('next').onclick=()=>{$('msg').textContent='第一关完成！第二关视唱练习正在开发中。';stop()};</script></body></html>
